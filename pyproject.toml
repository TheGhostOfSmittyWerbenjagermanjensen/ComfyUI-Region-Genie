[project]
name = "comfyui-region-genie"
description = "Regional prompting and regional LoRAs for ComfyUI: paint regions on a layered canvas and get masks, bboxes, layout prompts and per-region LoRAs (MOSS-Image, Krea 2, Ideogram 4, Flux, Anima, SDXL / SD1.5)."
version = "0.34.1"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
# Everything the pack imports (torch, numpy, Pillow, scipy) is installed with ComfyUI itself.
dependencies = []

[project.urls]
Repository = "https://github.com/TheGhostOfSmittyWerbenjagermanjensen/ComfyUI-Region-Genie"
Documentation = "https://github.com/TheGhostOfSmittyWerbenjagermanjensen/ComfyUI-Region-Genie#readme"
"Bug Tracker" = "https://github.com/TheGhostOfSmittyWerbenjagermanjensen/ComfyUI-Region-Genie/issues"

[tool.comfy]
# PublisherId: only needed to publish to the Comfy Registry (create one at registry.comfy.org, then fill it in).
PublisherId = ""
DisplayName = "Region Genie"
Icon = ""
