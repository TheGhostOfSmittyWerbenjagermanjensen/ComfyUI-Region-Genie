# The checks that need no ComfyUI and no GPU. The real-ComfyUI tests (tests/real_*.cjs, test_control.py,
# test_select.py) need a ~5 GB setup and stay manual: see tests/README.md.
name: tests
# Once per pull request (from a branch of this repository or from a fork: both test the result of merging it into
# main), and once for every push to main. A branch that has no pull request yet is not tested by itself: run the
# workflow by hand for it (Actions > tests > Run workflow), or open the pull request.
# (Until round 70 every push to any branch ran it; with the pull_request trigger added for forks, that ran everything
# twice for a pull request from a branch of this repository.)
# A fork's run gets a read-only token and no secrets (permissions below; GitHub's rule for forks).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install numpy Pillow scipy
      - name: Syntax
        run: python -m py_compile *.py tests/*.py
      - name: Python tests (stubbed torch / comfy)
        run: bash tests/run_py.sh
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Syntax
        run: |
          for f in js/*.js js/editor/*.js; do node --check --input-type=module < "$f" || exit 1; done
          for f in tests/*.cjs; do node --check "$f" || exit 1; done
      - name: Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Editor tests (stub page)
        run: bash tests/run_ui.sh
