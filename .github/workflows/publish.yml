# Publishes the version in pyproject.toml to the Comfy Registry (which ComfyUI Manager installs from).
# Manual only: Actions > "Publish to Comfy registry" > Run workflow. The Registry's own example also runs on every
# change of pyproject.toml; the version there is raised in almost every round, so that would release every merge.
# Needs the repository secret REGISTRY_ACCESS_TOKEN: the publisher's API key from registry.comfy.org.
# A published version can't be changed: raise the version first, and publish from main.
name: Publish to Comfy registry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
